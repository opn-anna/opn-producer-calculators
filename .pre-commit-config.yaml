exclude: ^archive/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^(README\.md|index\.html|app\.css|egg-price/index\.html|meat-price/index\.html|stock-density/index\.html|src/.*\.mjs|scripts/.*\.mjs|spec/.*\.json|\.pre-commit-config\.yaml)$
  - repo: local
    hooks:
      - id: verify-calculator-parity
        name: verify calculator parity baseline
        entry: node --test scripts/test.mjs
        language: system
        pass_filenames: false
        files: ^(src/.*\.mjs|scripts/test\.mjs|spec/baseline-outputs\.json)$
