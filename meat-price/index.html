<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="meta.meat.title">Meat Chicken Price Calculator</title>
    <meta
      name="description"
      content="Calculate the true cost of production for pasture-raised meat chickens."
      data-i18n-content="meta.meat.description"
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body data-calculator="meat" data-page="meat">
    <header class="page-header">
      <h1 data-i18n="page.meat.title">Meat Chicken Price Calculator</h1>
      <p data-i18n="page.meat.description">
        Calculate the true cost of production to ensure sustainable pricing for
        your pasture-raised meat chickens.
      </p>
      <nav class="page-nav">
        <a href="/" data-i18n="nav.home">Home</a>
        <a href="/egg-price/" data-i18n="nav.egg">Egg Price</a>
        <a href="/meat-price/" data-i18n="nav.meat">Meat Chicken Price</a>
        <a href="/stock-density/" data-i18n="nav.stock">Stock Density</a>
      </nav>
      <div class="language-switch">
        <span class="language-switch-label" data-i18n="language.label"
          >Language</span
        >
        <div class="language-switch-options" role="group" data-language-group>
          <button type="button" data-language-option="en">EN</button>
          <button type="button" data-language-option="es">ES</button>
        </div>
      </div>
    </header>
    <main class="layout">
      <section class="panel">
        <div class="panel-header">
          <h2 data-i18n="common.inputs">Inputs</h2>
          <button id="reset-defaults" type="button" data-i18n="common.reset">
            Reset to defaults
          </button>
        </div>
        <div id="fields"></div>
      </section>
      <section class="panel">
        <h2 data-i18n="common.outputs">Outputs</h2>
        <div id="summary" aria-live="polite"></div>
        <h3 data-i18n="meat.breakdown.heading">Cost Breakdown (per bird)</h3>
        <div id="breakdown"></div>
      </section>
    </main>
    <script type="module" src="/src/app.mjs"></script>
  </body>
</html>
