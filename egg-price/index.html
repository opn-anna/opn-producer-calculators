<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="meta.egg.title">Egg Price Calculator</title>
    <meta
      name="description"
      content="Calculate the true cost of production to ensure sustainable pricing for your pasture-raised eggs"
      data-i18n-content="meta.egg.description"
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body data-calculator="egg" data-page="egg">
    <header class="page-header">
      <div class="brand-mark">
        <span class="brand-mark-text">Oregon Pasture Network</span>
      </div>
      <h1 data-i18n="page.egg.title">Egg Price Calculator</h1>
      <p data-i18n="page.egg.description">
        Calculate the true cost of production to ensure sustainable pricing for
        your pasture-raised eggs
      </p>
      <nav class="page-nav">
        <a href="/" data-i18n="nav.egg">Egg Price</a>
        <a href="/meat-price" data-i18n="nav.meat">Meat Price</a>
        <a href="/stock-density" data-i18n="nav.stock">Stock Density</a>
      </nav>
      <div class="language-switch">
        <span class="language-switch-label" data-i18n="language.label"
          >Language</span
        >
        <div class="language-switch-options" role="group" data-language-group>
          <button type="button" data-language-option="en">EN</button>
          <button type="button" data-language-option="es">ES</button>
        </div>
      </div>
    </header>
    <main class="layout">
      <section class="panel">
        <div class="panel-header">
          <button id="reset-defaults" type="button" data-i18n="common.reset">
            Reset to Defaults
          </button>
        </div>
        <div id="fields"></div>
      </section>
      <section class="panel">
        <div id="summary" aria-live="polite"></div>
        <div id="breakdown"></div>
      </section>
    </main>
    <script type="module" src="/src/app.mjs"></script>
  </body>
</html>
