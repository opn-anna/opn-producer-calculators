<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Density Calculator</title>
    <meta
      name="description"
      content="Calculate paddock sizing and stocking density based on forage and herd inputs."
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body data-calculator="stock">
    <header class="page-header">
      <h1>Stock Density Calculator</h1>
      <p>Calculate optimal stocking density for your pasture management.</p>
      <nav class="page-nav">
        <a href="/egg-price/">Egg Price</a>
        <a href="/meat-price/">Meat Chicken Price</a>
        <a href="/stock-density/">Stock Density</a>
      </nav>
    </header>
    <main class="layout">
      <section class="panel">
        <div class="panel-header">
          <h2>Inputs</h2>
          <button id="reset-defaults" type="button">Reset to defaults</button>
        </div>
        <div id="stock-mode"></div>
        <div id="fields"></div>
      </section>
      <section class="panel">
        <h2>Outputs</h2>
        <div id="summary"></div>
        <h3>Animal Breakdown</h3>
        <div id="breakdown"></div>
      </section>
    </main>
    <script type="module" src="/src/app.mjs"></script>
  </body>
</html>
